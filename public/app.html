    try {
      var t = localStorage.getItem('lf_theme') || 'dark';
      var d = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d || !t ? 'dark' : 'light';
    } catch(e){}
  })();
</script>
